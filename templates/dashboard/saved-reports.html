<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathway — Saved Reports</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  :root{
    --c1:#001D39; --c2:#0A4174; --c3:#49769F; --c4:#4E8EA2;
    --c5:#6EA2B3; --c6:#7BBDE8; --c7:#BDD8E9; --bg:#f4f8fb;
    --card:#ffffff; --border:rgba(10,65,116,0.15);
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', Arial, sans-serif;}
  body{ background:var(--bg); color:var(--c1); }
  .app{ display:flex; min-height:100vh; }

  .sidebar{ width:250px; background:var(--c1); color:var(--c7); display:flex; flex-direction:column; justify-content:space-between; padding:24px 18px; flex-shrink:0; }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:32px; }
  .brand .logo-box{ width:38px; height:38px; border-radius:10px; background:var(--c4); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; }
  .brand .name{ font-size:15px; font-weight:600; color:#fff; }
  .brand .tag{ font-size:11px; color:var(--c6); }
  .menu-label{ font-size:11px; letter-spacing:.05em; color:var(--c3); margin:6px 0 10px 10px; }
  nav a{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; margin-bottom:4px; color:var(--c7); text-decoration:none; font-size:14px; }
  nav a.active{ background:var(--c2); color:#fff; }
  nav a:hover:not(.active){ background:rgba(255,255,255,0.06); }
  
  .main{ flex:1; padding:32px 40px; overflow-y:auto; }
  .eyebrow{ font-size:12px; letter-spacing:.08em; color:var(--c3); font-weight:600; }
  .page-title{ font-size:30px; font-weight:700; margin:4px 0 22px; color:var(--c1); }

  .reports-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:20px; }
  .report-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; position:relative; }
  .report-card h4{ font-size:16px; color:var(--c1); margin-bottom:8px; }
  .report-card p{ font-size:12px; color:var(--c3); margin-bottom:16px; }
  .report-meta{ font-size:11px; color:var(--c5); display:flex; justify-content:space-between; align-items:center; }
  .btn-view{ background:var(--c7); color:var(--c2); border:none; padding:6px 12px; border-radius:6px; font-weight:600; cursor:pointer; font-size:12px; }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='theme/theme.css') }}">
<script>!function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'}document.documentElement.dataset.theme=t}();</script>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="logo-box">DT</div>
<div>
    <div class="name">Decision Twin</div>
    <div class="tag">Career Intelligence</div>
</div>
      </div>
      <div class="menu-label">MENU</div>
      <nav>
    <a href="{{ url_for('home') }}">
        <i class="ti ti-home"></i>Home
    </a>

    <a href="{{ url_for('dashboard') }}">
        <i class="ti ti-layout-dashboard"></i>Dashboard
    </a>

    <a href="{{ url_for('compare') }}">
        <i class="ti ti-arrows-left-right"></i>Quick Compare
    </a>

    <a href="{{ url_for('saved_reports') }}" class="active">
        <i class="ti ti-bookmark"></i>Saved Reports
    </a>

    <a href="{{ url_for('career_roadmap') }}">
    <i class="ti ti-route"></i>Career Roadmap
</a>

    <a href="{{ url_for('resume_analyser') }}">
    <i class="ti ti-file-search"></i>Resume Analyser
</a>

    <a href="{{ url_for('mentor') }}">
        <i class="ti ti-robot"></i>AI Mentor
    </a>

    <a href="{{ url_for('roi') }}">
        <i class="ti ti-trending-up"></i>ROI Calculator
    </a>

    <a href="{{ url_for('profile') }}">
    <i class="ti ti-user"></i>User Overview
</a>
</nav>
    </div>
  </aside>

  <main class="main">
    <div class="eyebrow">LIBRARY</div>
    <div class="page-title">Saved Reports</div>

    <div class="reports-grid" id="reportsGrid">
      <div class="report-card">
        <h4>Data Analyst vs. Data Scientist</h4>
        <p>Comprehensive salary and roadmap evaluation.</p>
        <div class="report-meta">
          <span>Saved report</span>
          <button class="btn-view" onclick="alert('Analysis summary: High skill overlay with target match rate.')">View Report</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
function fetchSavedReportsLocally() {
  const reports = JSON.parse(localStorage.getItem('saved_reports') || '[]');
  const grid = document.getElementById('reportsGrid');

  if (reports.length > 0) {
    grid.innerHTML = reports.map((r, index) => `
      <div class="report-card">
        <h4>${r.title}</h4>
        <p>${r.description || 'Saved Decision Twin Evaluation'}</p>
        <div class="report-meta">
          <span>Created ${new Date(r.created_at || Date.now()).toLocaleDateString()}</span>
          <button class="btn-view" onclick="viewReportInsights('${r.title}', '${r.description}')">View Report</button>
        </div>
      </div>
    `).join('');
  }
}

function viewReportInsights(title, description) {
  alert(`Report: ${title}\n\nDetails:\n${description}`);
}

document.addEventListener('DOMContentLoaded', fetchSavedReportsLocally);
</script>

<script src="{{ url_for('static', filename='theme/theme.js') }}"></script>
</body>
</html>
