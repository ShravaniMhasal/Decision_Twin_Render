<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password — Decision Twin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>

.auth-container-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:32px 20px;
    position:relative;
    z-index:1;
}

.auth-card{
    width:100%;
    max-width:460px;
    background:rgba(10,65,116,.25);
    border:1px solid rgba(123,189,232,.25);
    border-radius:20px;
    padding:40px;
}

.auth-header{
    text-align:center;
    margin-bottom:30px;
}

.auth-header h2{
    color:var(--white);
    margin-top:12px;
}

.auth-header p{
    color:var(--pale);
    font-size:.9rem;
    margin-top:8px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:var(--pale);
    font-size:.9rem;
}

.form-group input{
    width:100%;
    padding:12px 16px;
    border-radius:10px;
    border:1px solid rgba(123,189,232,.2);
    background:rgba(0,20,40,.6);
    color:white;
    font-size:.95rem;
    outline:none;
}

.form-group input:focus{
    border-color:var(--sky);
    box-shadow:0 0 10px rgba(123,189,232,.3);
}

.btn-submit{
    width:100%;
    margin-top:8px;
    padding:14px;
}

.back-home{
    position:fixed;
    top:20px;
    left:20px;
    color:var(--pale);
    z-index:9999;
}

.back-home:hover{
    color:var(--sky);
}
.flash-message{
    background:rgba(123,189,232,.15);
    color:var(--white);
    border:1px solid rgba(123,189,232,.35);
    padding:12px;
    border-radius:10px;
    margin-bottom:18px;
    text-align:center;
}
.password-wrapper{
    position:relative;
}

.password-wrapper input{
    padding-right:48px;
}

.toggle-password{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    user-select:none;
    color:var(--pale);
    font-size:18px;
}

.toggle-password:hover{
    color:var(--sky);
}
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='theme/theme.css') }}">
<script>!function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(!t){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'}document.documentElement.dataset.theme=t}();</script>

</head>
<body>
    <a href="{{ url_for('home') }}"
   class="back-home">
    ← Back to Decision Twin
</a>

<div class="bg-decor" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
</div>

<div class="auth-container-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="logo-text">
                DECISION <span class="accent">TWIN</span>
            </span>

            <h2>Reset Your Password</h2>

            <p>
                Create a new secure password for your Decision Twin account.
            </p>

        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
<form method="POST" autocomplete="off">

    <div class="form-group">

        <label for="password">New Password</label>

        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                required>

            <span class="toggle-password" onclick="togglePassword('password', this)">
                👁
            </span>

        </div>

    </div>

    <div class="form-group">

        <label for="confirm_password">Confirm New Password</label>

        <div class="password-wrapper">

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Re-enter your password"
                minlength="8"
                required>

            <span class="toggle-password" onclick="togglePassword('confirm_password', this)">
                👁
            </span>

        </div>

    </div>

    <button type="submit" class="btn btn-accent btn-submit">
        Reset Password
    </button>

</form>
<script>
function togglePassword(inputId, icon){

    const input = document.getElementById(inputId);

    if(input.type === "password"){
        input.type = "text";
        icon.textContent = "🙈";
    }else{
        input.type = "password";
        icon.textContent = "👁";
    }

}

document.querySelector("form").addEventListener("submit", function(e){

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm_password").value;

    if(password.length < 8){
        alert("Password must be at least 8 characters long.");
        e.preventDefault();
        return;
    }

    if(password !== confirm){
        alert("Passwords do not match.");
        e.preventDefault();
        return;
    }

});
</script>

</div>
</div>

<script src="{{ url_for('static', filename='theme/theme.js') }}"></script>
</body>
</html>
